            - img "MVP (Most Valuable Person)" [ref=f12e205]
            - generic [ref=f12e206]:
              - generic [ref=f12e207]:
                - heading "MVP (Most Valuable Person)" [level=3] [ref=f12e210]
                - paragraph [ref=f12e211]: "The MVP award honors the most outstanding individual of the year — the exemplary face representing the entire Sun* collective. They are people who have demonstrated exceptional capability, unwavering dedication, and far-reaching influence, leaving a strong mark on Sun*'s journey over the past year. Not only outstanding in performance and work results, they are also a spreading source of inspiration — through their thinking, actions, and positive influence on the team. The MVP embodies the full qualities of an outstanding Sun* person, while carrying a great responsibility: to become a role model representing Sun*'s people and spirit, helping lead the team to new heights."
