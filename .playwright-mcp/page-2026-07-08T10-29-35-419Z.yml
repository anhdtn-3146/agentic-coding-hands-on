          - generic [ref=f12e166]:
            - img "Signature 2025 - Creator" [ref=f12e169]
            - generic [ref=f12e170]:
              - generic [ref=f12e171]:
                - heading "Signature 2025 - Creator" [level=3] [ref=f12e174]
                - paragraph [ref=f12e175]: The Signature award honors individuals or teams who embody the distinctive spirit Sun* aims for in each era. In 2025, the Signature award honors the Creator — individuals/teams with a proactive, perceptive mindset who always see opportunity in challenges and take the lead in action. They are quick to spot problems and deliver practical solutions that bring clear value to projects, clients, or the organization. With a creative mindset and the "Creator" spirit distinctive to Sun*, they not only respond positively to change but also proactively drive improvements, helping shape new standards for how Sun* people create value.
