              - generic [ref=f12e91]:
                - heading "Top Project" [level=3] [ref=f12e94]
                - paragraph [ref=f12e95]: The Top Project award honors outstanding project teams that deliver business results beyond expectations, optimal operational efficiency, and a dedicated working spirit. These are projects with high technical complexity and excellent resource and cost optimization, that propose valuable ideas for clients, generate outstanding profit, and receive positive feedback from clients. Members strictly adhere to internal development standards throughout the project, setting a model of excellence and professionalism.
