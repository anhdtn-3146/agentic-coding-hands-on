              - generic [ref=f12e118]:
                - heading "Top Project Leader" [level=3] [ref=f12e121]
                - paragraph [ref=f12e122]: The Top Project Leader award honors outstanding project managers — those who combine solid management capability, a strong ability to inspire, and an "Aim High – Be Agile" mindset in every challenge and context. Under their leadership, team members not only overcome challenges and achieve set goals together, but also keep the flame of enthusiasm and the Wasshoi spirit alive, growing into a finer, happier version of themselves.
              - generic [ref=f12e124]:
