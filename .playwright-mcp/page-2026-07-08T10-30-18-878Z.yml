              - img "Further" [ref=f15e82]
            - paragraph [ref=f15e83]: AI時代の目まぐるしい変化と高まり続ける顧客の期待を前に、Sun*は能力の多様化という戦略を選びました。自分たちの領域で卓越した存在を目指すだけでなく、さらに高い目標へ——すべてのSunnerが「プロブレムソルバー」となり、プロジェクト、顧客、そして社会のあらゆる課題を解決できる専門家であることを目指しています。 多様な能力、柔軟な成長力、そしてAI時代を突破するために深く掘り下げる精神からインスピレーションを得て、「Root Further」はSun* Annual Awards 2025の公式テーマに選ばれました。 表面的な意味を超えて、「Root Further」とは、私たちがより遠くへ、より深く根を張り続ける旅そのものです。隠された「地層」に触れながら、Sun*の人々が持ち続ける価値創造への情熱を存続させ、高め、育んでいく旅です。土の奥深くへと伸び続ける根のように、幾重にも重なる「堆積層」を力強くくぐり抜けて最も純粋な養分を吸収するように、Sun*の人々もこの時代と市場の試練から養分を「吸収」し、日々自らを刷新し、能力を広げ、AI時代という全く新しく複雑で予測困難な、しかし無限の可能性とチャンスに満ちた「地層」へと力強く「根を下ろして」います。
            - paragraph [ref=f15e84]: 「深く根を張った木は嵐を恐れない」 (英語のことわざ)
            - paragraph [ref=f15e85]: 嵐を前にして、十分に強い根を持つ木だけが立ち続けることができます。多様な能力に自信を持ち、挑戦を創造し受け入れる準備ができ、変化を自ら制する個人で構成された組織こそが、変動の中でも揺るがず、あらゆる優位性を活かし、時代の課題を乗り越えられる組織です。「Root Further」は単に組織の成長における新たな章の名前にとどまらず、私たち一人ひとりへの応援でもあります——自分自身を信じる勇気を持ち、深く掘り下げてあらゆる可能性を切り拓く勇気を持ち、限界を打ち破る勇気を持ち、最も多才で卓越した自分になる勇気を持つようにと。AI時代において、能力の多様性と時代の力を活かすことこそが、永続するための必須条件だからです。 テクノロジー業界と現代市場の「地中」深くに、まだどれほどの謎めいた「地層」が眠っているのか、誰にも分かりません。ただ確かなのは、「Root Further」が根源の精神となったとき、私たちは前進する道のどんな未知の領域を前にしても、恐れではなくむしろ高揚感を覚えるということです。なぜなら、その果てしない領域の中にこそ、数多くの奇跡と飛躍のチャンスが私たちを待っていると、私たちは信じているからです。
