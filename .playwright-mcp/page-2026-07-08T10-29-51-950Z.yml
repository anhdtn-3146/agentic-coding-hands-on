            - generic [ref=f13e206]:
              - generic [ref=f13e207]:
                - heading "MVP (Most Valuable Person)" [level=3] [ref=f13e210]
                - paragraph [ref=f13e211]: MVP賞は、その年最も優れた個人を称える賞であり、Sun*全体を代表する模範的存在です。卓越した能力、揺るぎない献身精神、そして広範な影響力を発揮し、この一年のSun*の歩みに強い足跡を残した人材が対象となります。パフォーマンスや業務成果で際立つだけでなく、その思考、行動、そしてチームへの前向きな影響を通じて、インスピレーションを広げる存在でもあります。MVPは優れたSun*人材の資質を余すところなく備えると同時に、Sun*の人材と精神を体現するロールモデルとなり、チームを新たな高みへと導くという大きな責任を担います。
