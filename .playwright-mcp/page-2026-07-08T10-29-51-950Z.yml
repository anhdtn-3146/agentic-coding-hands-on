                - heading "Top Talent" [level=3] [ref=f13e67]
                - paragraph [ref=f13e68]: Top Talent賞は、総合的に卓越した個人を称える賞です。確かな専門能力と卓越した業務パフォーマンスを発揮し続け、常に期待を超える価値を提供し、顧客やチームメンバーから高い評価を得ている人材が対象となります。組織から任されたあらゆる業務を進んで引き受ける姿勢を持ち、常にインスピレーションの源として、チーム全体のモチベーションを高め、前向きな影響を与え続けます。
              - generic [ref=f13e70]:
