            - img "Signature 2025 - Creator" [ref=f13e169]
            - generic [ref=f13e170]:
              - generic [ref=f13e171]:
                - heading "Signature 2025 - Creator" [level=3] [ref=f13e174]
                - paragraph [ref=f13e175]: Signature賞は、Sun*が各時代に目指す特有の精神を体現する個人またはチームを称える賞です。2025年のSignature賞は「Creator」を称えます — 主体的で鋭敏な思考を持ち、常に課題の中にチャンスを見出し、行動において先陣を切る個人・チームです。彼らは問題に敏感で、迅速に課題を認識し、プロジェクト、顧客、組織に明確な価値をもたらす実践的な解決策を提示します。Sun*ならではの創造的思考と「Creator」精神を持ち、変化に前向きに対応するだけでなく、自ら改善を生み出し、Sun*の人材が価値を創造する新たな基準を築く一助となります。
