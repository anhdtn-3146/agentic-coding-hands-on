            - generic [ref=f13e117]:
              - generic [ref=f13e118]:
                - heading "Top Project Leader" [level=3] [ref=f13e121]
                - paragraph [ref=f13e122]: Top Project Leader賞は、確かなマネジメント能力、強い鼓舞力、そしてあらゆる課題や状況において「Aim High – Be Agile」の思考を体現する優れたプロジェクトマネージャーを称える賞です。彼らのリーダーシップの下、メンバーは共に困難を乗り越え、目標を達成するだけでなく、情熱の炎とWasshoi精神を持ち続け、より洗練され幸せな自分へと成長していきます。
              - generic [ref=f13e124]:
